name: birdsong_app
description: 学个鸟语 - 每天一小步的英语学习 app
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  content_models:
    path: ../packages/content_models
  srs_core:
    path: ../packages/srs_core
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  just_audio: ^0.9.40
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  content_pipeline:
    path: ../tools/content_pipeline

flutter:
  uses-material-design: true
  assets:
    - assets/
